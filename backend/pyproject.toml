[project]
name = "medarx"
version = "0.1.0"
description = "Medarx privacy kernel: allowlisted extraction, pseudonymization, redaction, and a fail-closed policy engine."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "presidio-analyzer",
    "presidio-anonymizer",
    "spacy==3.8.16",
    "pydicom",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "psycopg2-binary",
    "httpx",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medarx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: end-to-end demo tests needing the observer and capture"]
pythonpath = ["src", ".."]
