name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # `en_core_web_sm` is not a declared dependency, so `uv sync` leaves it
      # out and the bootstrap script below puts it back. Run them in this order:
      # running the bootstrap after a sync is the only order that works, because
      # a sync prunes the model again.
      - name: Sync
        working-directory: backend
        run: |
          uv sync
          bash src/medarx/scripts/bootstrap_ner_model.sh

      - name: Backend suite
        working-directory: backend
        # Counts come from the XML, not from stdout: pytest's final summary line
        # is lost when stdout is a pipe, and a missing last line is not evidence
        # of a truncated run.
        run: uv run pytest -q --junit-xml=../ci-backend.xml

      - name: Evaluation harness
        working-directory: backend
        run: uv run pytest ../evals/test_eval_harness.py -q --junit-xml=../ci-evals.xml

      # The gate is the point of this step, so `--no-gate` is deliberately NOT
      # passed. `run_eval.py` exits non-zero when any figure moves against
      # `baseline.json` — the recorded `PATIENT_ID` 1/3 and the 5/28 and 6/28
      # false-positive rates that the README calls "what a later change is
      # measured against". Without this step a recognizer or replacer-table
      # change that moved them would land with a green suite and a stale
      # README. It costs a few seconds beside a suite that loads the same
      # spaCy model.
      - name: Evaluation gate
        working-directory: backend
        run: uv run python ../evals/run_eval.py

      - name: Upload junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: |
            ci-backend.xml
            ci-evals.xml
