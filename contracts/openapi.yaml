openapi: 3.1.0

info:
  title: Medarx Application API (Phase 1 Privacy Kernel)
  version: 0.1.0-phase1
  summary: HTTP surface for the Medarx Phase 1 privacy kernel.
  description: |
    Medarx is intended for research and demonstration. It performs administrative report assistance using clinician-supplied findings and authorized report text. It does not independently interpret medical images, make diagnostic or treatment recommendations, or autonomously submit clinical reports. Its regulatory classification has not been established, and it is not validated for clinical use.

    This document specifies component J (Application API) of the approved Phase 1 design: the HTTP surface that exercises components A through I. It is the privacy kernel's boundary, not a clinical product surface.

    ## Relationship to the design document

    The normative source for enforcement behaviour is §6 (Fail-Closed Enforcement) of the design. This specification is a faithful encoding of that table; the `layer` values used in the `BlockReceipt` correspond one-to-one with the design's layer designations (`A`, `D.1`, `D.2`, `D.3`, `E`, `F`).

    ## Two things this API deliberately does NOT do

    * **It does not accept arbitrary DICOM objects or free-form prompts.** This is a load-bearing design constraint, not a validation nicety. The request schemas are structured such that an arbitrary DICOM payload or a free-form prompt cannot even be expressed: DICOM metadata is a closed, allowlisted field set, and the only free text is a single `report_text` field that is itself a documented pipeline input. Any attempt to express something outside those shapes is rejected at this surface (see §6 row 1 of the design).

    * **It does not write back to any clinical system.** Every model response is a draft requiring explicit human sign-off. There is no endpoint that submits a report anywhere, and no endpoint that implies an autonomous clinical write-back. The approval endpoint records a human decision against the audit trail and nothing else; it does not transmit or publish the draft.

    ## Function scope

    The three named functions — `Draft`, `Prior Summary`, and `Ask` — are represented here as a **closed enum**. Phase 1 implements the privacy pipeline *around* them, not their full clinical behaviour: `Draft`'s automated output validation is a Phase 4 concern, and `Prior Summary` / `Ask` contract validation is a Phase 5 concern. What Phase 1 proves is that a request routed through any of them is authorized, allowlisted, pseudonymized, redacted, and policy-approved or refused before anything leaves the environment.

    ## Status-code contract

    Two refusal conditions must be distinguishable **by status code alone**, without parsing the body:

    | Status | Meaning | Raised by |
    |---|---|---|
    | `403 Forbidden` | Authenticated but not permitted — unauthorized study scope, or the function is not permitted for this caller. | Design §6 row 1 (authorization half) |
    | `422 Unprocessable Entity` | Privacy-policy block. The request was well-formed and authorized, but the privacy pipeline could not produce a policy-compliant payload. | Design §6 rows 2, 3, 4, 5, 6, 7 |
    | `400 Bad Request` | Structurally malformed request: unparseable body, wrong media type, or a JSON shape that does not match the schema. The request never became a valid request at all. | Design §6 row 1 (malformed request) |

    The `422`/`403` split is load-bearing and is asserted directly by the design's end-to-end test strategy. `403` is never returned for a privacy block, and `422` is never returned for an authorization failure.

    ## Request identity

    The design records a Request ID in the audit log and carries it in the block receipt and the approval response. **Choice: `X-Request-Id` is an optional request header on the execution endpoint.** When supplied it is honoured and recorded; when omitted the server generates one. It is a header rather than a body field because the request ID identifies the *request* rather than being part of the extraction input, and because a header still reaches the surface when the body is unparseable (`400`). This choice is stated here because the design does not fix it.

    ## Authentication

    The design's authorization model beyond the demo scope (roles, per-user permissions) is explicitly deferred to Phase 6 (§9). Phase 1 exercises **synthetic** study-scoped and function-scoped permission. This specification therefore declares no authentication scheme — root `security` is the empty list, which means "no security scheme is defined" and is the honest representation of Phase 1 scope. The `403` responses and the `scope` fields in request schemas describe an *authorization* boundary that is modelled and enforced, not a deployed identity system.

    ## Audit readback

    The audit log is append-only and raw PHI is never stored in it, by field-by-field storage policy. The readback response therefore returns **exactly the stored fields** — hashes, field names, action codes, approvals, dispositions. It deliberately exposes no raw-PHI field, because none exists to expose; a consumer needing payload content is looking at the wrong store.

    ## Three states, and where each one is produced

    | State | Produced by | Meaning |
    |---|---|---|
    | `needs_review` | `preflightFunctionExecution` (`200`) | Validated by A, C, D and E. **Nothing has been transmitted.** Awaiting an explicit human decision to send. |
    | `blocked` | any operation (`422` + `BlockReceipt`) | A component refused. **Nothing was transmitted.** The receipt names the component and its codes. |
    | `approved` | `sendApprovedExecution`, `createFunctionExecution` (`200` + `ExecutionResponse`) | The payload was approved *and* transmitted, and the model answered. |

    The third state exists because the atomic execution makes `approved` and `sent` the same
    instant, so before `preflightFunctionExecution` there was no moment at which a human was
    reviewing anything — a client showing a "needs review" state would have been asserting a
    privacy state the system never evaluated. Here the server produces it, from a pipeline that
    ran, and a `send` is a separate call that either transmits the payload that preflight
    published or refuses.

    **A validated preflight leaves no audit record**, because nothing was refused and nothing was
    transmitted: the record is written by the send, or by the block. `getAuditRecord` for a
    preflight that has not been sent is therefore `404`, and a client drawing a timeline for one
    must handle that rather than assume the record is there.

    ## The authorization boundary, and what it is not

    Every operation except `getPolicyConfiguration` requires the `X-Scope` header, declared once
    in `components.parameters.ScopeHeader` and referenced by each. `X-Scope` is a **synthetic
    demonstration input that models an authorization boundary. It is not an authentication
    mechanism and it is not a defence against an attacker**: this document declares no security
    scheme, root `security` is the empty list, and anyone who can reach this server can present
    any scope they like. A client that treats the header as a credential, or that omits it because
    a generated client did not know to send it, is wrong in the two opposite directions and both
    are visible at the first request. Real authentication and per-user authorization are deferred
    to Phase 6.

    `getPolicyConfiguration` takes no scope and declares no `403`: it reads the deployment's own
    configuration and touches no study, draft or record. That is stated on the operation rather
    than left as an omission, because a header that is required everywhere else and silently
    optional on one route is a header a client cannot reason about.

    ## Where the pipeline stages are, and are not

    `PreflightResponse.stages` carries the stages a preflight reached — five of the six, because
    `Model request` belongs to component F and a preflight stops before it. `ExecutionResponse` and
    `BlockReceipt` deliberately do **not** carry `stages`: both are closed schemas the design
    fixes, and adding a field to a block receipt that an auditor reads as "the whole of what was
    refused" is a change to that artefact rather than a convenience. A client drawing a timeline
    for either reads `getAuditRecord`, where `stages` is derived from the stored `layer` — which is
    the architecturally correct source, because the audit log is the evidence and a timeline built
    from the live execution would be Medarx attesting to itself. **A `layer` of `J` yields an empty
    `stages` list**: the request surface refused before any stage was behind the request, and a
    client must render that as "refused at the request surface", not as a missing timeline.
  contact:
    name: Medarx (research / demonstration project)
  license:
    name: Unlicensed — research and demonstration use only
    identifier: "Proprietary"

tags:
  - name: execution
    description: >-
      Component J — function execution. Exercises A (allowlisted extraction), C (pseudonymization),
      D (layered redaction), E (policy) and F (model gateway). Phase 1 scope.
  - name: approval
    description: >-
      Explicit human sign-off against a drafted model response. Records a decision in the audit
      log (component G). Never transmits, publishes, or submits anything.
  - name: policy
    description: >-
      Component E — policy inspection. Reports the configured policy mode and the de-identification
      policy version. Read-only; the policy mode is a deployment configuration, not something a
      request may select.
  - name: audit
    description: >-
      Component G — append-only, tamper-evident audit readback. Returns stored fields only;
      raw PHI is never stored and therefore never returned.
  - name: preflight
    description: >-
      Component J — validate-then-send. Runs A, C, D and E and **stops before F**: returns the
      transformed payload the model would receive, the field-action summary, the payload hash, the
      stage list, and the policy configuration in force. A second operation transmits exactly the
      payload a preflight approved. Phase 2 scope; additive to the Phase 1 surface, which is
      unchanged.

servers:
  - url: http://localhost:8000
    description: >-
      Phase 1 local deployment. No production deployment is described by the design.

security: []

paths:
  /v1/functions/{function_name}/executions:
    post:
      tags: [execution]
      operationId: createFunctionExecution
      summary: Execute a named function over clinician-supplied report text and allowlisted DICOM metadata.
      description: |
        Submits an execution request for one of the three closed functions (`Draft`, `Prior Summary`,
        `Ask`) against a study context, with clinician-supplied report text and an allowlisted set of
        DICOM metadata fields, plus any prior-study references.

        On success the response is the model response **as a draft requiring explicit human sign-off**,
        together with the request ID, the selected model, the de-identification policy version, and the
        hash of the approved payload that was transmitted. No endpoint in this API submits that draft
        anywhere; recording a human decision is `recordHumanApproval`.

        On any privacy-policy block the response is `422` with a `BlockReceipt`. Raw PHI values never
        appear in a block receipt, and nothing is transmitted to a provider — in either implemented
        policy mode.

        This operation does NOT accept arbitrary DICOM objects or free-form prompts. The only DICOM
        fields expressible are those in `AllowlistedDicomMetadata`, and the only free text is
        `report_text`, which is a documented pipeline input rather than a prompt. Submitting anything
        outside those shapes is rejected at this surface and never enters the pipeline.
      parameters:
        - $ref: '#/components/parameters/ScopeHeader'
        - $ref: '#/components/parameters/FunctionNamePathParam'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        description: The execution request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: >-
            The privacy pipeline approved the payload and the model gateway returned a response.
            The response is a draft; it has not been approved by a human and has not been written
            to any clinical system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '400':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/MalformedRequest'
        '403':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Forbidden'
        '404':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/FunctionNotFound'
        '415':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Blocked'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'

  /v1/executions/{request_id}/approval:
    post:
      tags: [approval]
      operationId: recordHumanApproval
      summary: Record an explicit human approval or rejection of a drafted model response.
      description: |
        Records a human sign-off decision against a previously approved execution. This is the
        only path by which a draft becomes "approved", and it is deliberately narrow:

        * It records a decision **in the audit log only**. It does not publish the draft, submit it
          to a clinical system, or trigger any downstream clinical action. Medarx has no autonomous
          clinical write-back, and this endpoint does not create one.
        * It accepts no draft content. The draft already exists; the caller approves or rejects it by
          `request_id`, and cannot edit or resubmit a modified payload through this path. Editing a
          draft requires a new execution, which re-runs the whole privacy pipeline.
        * A rejected draft is recorded as a final disposition of `rejected`, not deleted. The audit log
          is append-only.

        Requires a human-supplied reviewer identity. In Phase 1 this is a synthetic identifier, since
        the design's per-user authorization model is deferred to Phase 6.
      parameters:
        - $ref: '#/components/parameters/ScopeHeader'
        - $ref: '#/components/parameters/RequestIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HumanApprovalRequest'
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: The approval or rejection was recorded in the append-only audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanApprovalResponse'
        '400':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/MalformedRequest'
        '403':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Forbidden'
        '404':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/ExecutionNotFound'
        '409':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: >-
            A human decision has already been recorded for this request ID. The audit log is
            append-only, so a decision is immutable; a changed mind requires a new execution.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '415':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'

  /v1/functions/{function_name}/executions/preflight:
    post:
      tags: [preflight]
      operationId: preflightFunctionExecution
      summary: Validate a request and publish the payload a send would transmit, without sending it.
      description: |
        Runs components A (allowlisted extraction), C (pseudonymization), D (redaction layers 1–3)
        and E (policy), in that order, and **stops before F**. No provider is contacted, no socket
        is opened and no request body leaves the environment: the return is `needs_review`, the
        third state, and it is produced by the server from a pipeline that actually ran.

        On success the response carries:

        * `payload` — **the transformed payload itself**, field for field, being exactly what the
          model would receive and nothing more. It is not a description of it and not a rendering
          of it, so a client must not reconstruct, re-derive or approximate it;
        * `field_actions` — one entry per field of the payload plus one per property the caller
          supplied that no payload field carries, each `included`, `transformed` or `excluded`;
        * `approved_payload_hash` — the hash component F re-derived from that payload's own
          content, in the `sha256:` spelling. This is the value a send is bound to, and the value
          independent egress verification compares observed bytes against;
        * `stages` — the pipeline stages this preflight reached. **Five, not six**: `Model request`
          belongs to component F and a preflight stops before it, so a client rendering six stages
          here would be claiming a provider was called;
        * `policy_version` and `policy_mode` — the configuration in force. Both are **read-only
          reporting**. This operation takes the same closed `ExecutionRequest` as the atomic path,
          which has no `policy_mode` property and is `additionalProperties: false`, so a request
          that supplies one is a `400`. A client must render the mode and must not offer a control
          that changes it: the mode is a deployment configuration precisely so that a caller cannot
          route around the boundary by picking a laxer one, and a working selector would be a
          second, unaudited way to choose the boundary;
        * `request_id` — the identifier a send takes.

        On any privacy-policy block the response is `422` with a `BlockReceipt`, exactly as the
        atomic operation returns one, and the block is recorded in the audit log the same way.
        **A blocked preflight transmits nothing.**

        A preflight that validates writes **no** audit record: nothing was refused and nothing was
        transmitted, and the record's `stages` is derived from a stored `layer` whose only null
        case means "reached every stage" — a record here would claim a model call that never
        happened. `getAuditRecord` for a validated-but-unsent preflight is `404`. The record is
        written by `sendApprovedExecution`, or by the block.

        The payload returned here is the payload, not a summary of one, and every value in it has
        been approved for a model. It is still the payload: a client must not persist it in
        browser storage, and must not log a response body.
      parameters:
        - $ref: '#/components/parameters/FunctionNamePathParam'
        - $ref: '#/components/parameters/ScopeHeader'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        description: The execution request to validate. Identical to `createFunctionExecution`'s.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: >-
            The privacy pipeline approved the payload and nothing has been transmitted. The
            response is `needs_review`: a validated payload awaiting an explicit human decision to
            send it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflightResponse'
        '400':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/MalformedRequest'
        '403':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Forbidden'
        '404':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/FunctionNotFound'
        '415':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Blocked'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'

  /v1/executions/{request_id}/send:
    post:
      tags: [preflight]
      operationId: sendApprovedExecution
      summary: Transmit exactly the payload a preflight approved, and return the model's answer.
      description: |
        Takes a request ID from a preflight and transmits **exactly the payload that preflight
        approved** — the same object, and the same wire bytes built and encoded when component F
        authorised it. Nothing is recomputed: no component is re-run, no payload is re-derived, no
        second attempt is made to build the body. A preview and a transmission therefore cannot
        disagree, because there is no second computation for them to disagree about.

        This is the human's explicit go. `recordHumanApproval` is a different operation with a
        different job — it records a judgement about a draft that already exists — and this one is
        the transmission gate in front of it.

        **It accepts no body and no content of any kind.** The draft cannot be edited,
        substituted or smuggled through this path: the caller names a request ID and the server
        transmits what it authorised for it. Editing a draft requires a new preflight, which re-runs
        the whole privacy pipeline and re-approves.

        An approval is **one-shot** and is consumed by the first send, whether or not that send
        succeeded, so a double-clicked control cannot transmit twice and cannot file two records
        under one request ID. A later send for the same request ID is `404`, as is a send for a
        request ID that was never preflighted.

        An approval is **not durable**. The pending payload is held in the serving process, in
        memory, bounded in number, and is never written to the audit log — whose storage policy
        admits no field that could hold a value. A restart of the process therefore loses every
        pending approval, and a send across a restart is `404` rather than a re-derivation. That
        is the deliberate cost: re-running the pipeline at send time would transmit a payload
        nobody previewed, which is the failure this pair of operations exists to make impossible.

        Three conditions refuse the send before any byte moves, and none of them is a
        `ProblemDetail` about a privacy block except where the contract says so:

        * `404` — no pending approval: an unknown, already-sent, evicted or restarted request ID.
        * `422`, layer `E`, `UNKNOWN_POLICY_VERSION` — the policy version in force is not the one
          the approval was made under (design §6 row 6).
        * `422`, layer `F`, `PAYLOAD_MISMATCH` + `HASH_MISMATCH` — the token the send would transmit
          was authorised for a different payload than the preflight approved (design §6 row 7).

        On success the response is the same `ExecutionResponse` the atomic operation returns, with
        `status: approved`, the model response as a **draft requiring explicit human sign-off**, and
        the hash of the payload that was transmitted. A record is appended to the audit log with
        `final_disposition: pending_human_approval`, and `human_approval` is `null` on the record
        until a human decision is recorded against the request ID.
      parameters:
        - $ref: '#/components/parameters/RequestIdPathParam'
        - $ref: '#/components/parameters/ScopeHeader'
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: >-
            The approved payload was transmitted and the model gateway returned a response. The
            response is a draft; it has not been approved by a human and has not been written to
            any clinical system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResponse'
        '403':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Forbidden'
        '404':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/ExecutionNotFound'
        '422':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Blocked'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'
  /v1/policy:
    get:
      tags: [policy]
      operationId: getPolicyConfiguration
      summary: Inspect the configured policy mode and de-identification policy version.
      description: |
        Read-only inspection surface over component E. Returns the policy mode the deployment is
        configured with and the de-identification policy version currently in force.

        The three named modes are:

        * `strict_local` — implemented in v1.
        * `cloud` — implemented in v1.
        * `authorized_local` — **documented as an architectural extension only.** The design states it
          is never implemented against identifiable data in the demo, and its definition of a
          "trusted environment" is deferred beyond Phase 6. It is reported here as
          `implemented: false` and must not be selected by a request.

        The policy mode is a **deployment configuration**, not a per-request parameter. A request
        cannot choose its mode: the mode is fixed for the deployment precisely so that a caller
        cannot route around the boundary by picking a laxer one. Consequently `ExecutionRequest`
        has no `policy_mode` field, and a request that supplies one is a malformed request (`400`).

        **A client must render this value read-only and must not offer a control that changes it.**
        The route control in the UI is display, not selection: a working selector would be a
        second, unaudited way to choose the boundary, which is the exact thing the paragraph above
        exists to prevent, and it would reach a different boundary than the one every receipt and
        audit record was written under. Changing modes is a deployment change — a restart with a
        different configuration — and there is no endpoint, in this document or any other, that
        performs it. `PreflightResponse.policy_mode` reports the same value for the same reason, so
        a client showing the active route next to a payload preview has one source and not two.

        **This operation requires no `X-Scope` and declares no `403`.** It reads the deployment's own
        configuration and touches no study, draft or record, so there is nothing to authorize
        against. This is stated on the operation rather than left as an omission, because a header
        that is required on every other operation and silently optional here is a header a client
        cannot reason about.

        The returned `policy_version` is the value that appears in block receipts and audit records.
        An unknown or missing policy version causes a fail-closed block in every implemented mode
        (design §6 row 6), so this endpoint is also the way a caller confirms the version in force
        before relying on receipts.
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: The policy configuration in force for this deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyConfiguration'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'

  /v1/audit/records:
    get:
      tags: [audit]
      operationId: listAuditRecords
      summary: Read back audit records (append-only, raw-PHI-free).
      description: |
        Read-only query surface over component G's append-only, tamper-evident log.

        The response returns **exactly the fields the storage policy persists**: request ID and
        timestamp, function and selected model, de-identification policy version, input and
        approved-payload hashes, redacted field names and action codes, human approval, and final
        disposition.

        It deliberately exposes **no raw-PHI field**, because the audit log never stores one. There is
        no such property on `AuditRecord` to omit, redact, or accidentally leak. Full model prompt
        and response belong to a separate optional restricted, encrypted diagnostic store, which is
        not reachable through this API and is out of Phase 1 scope.

        Records are returned in ascending timestamp order. `chain_verified` reports the result of
        hash-chain verification over the records returned: a relational database alone does not make
        a log immutable, so tampering evidence is verified on read rather than asserted.

        **This readback is not study-scoped, and no filter can make it so in Phase 1.** A caller must
        present a scope to read anything, but the scope is not applied to the page: `AuditRecord` is
        closed and carries no study or patient property, and the audit log's storage policy admits
        none — adding one would put a subject reference into the one store the design requires never
        to hold one. So the effective access control is "present a scope", and a caller holding one
        study's scope reads the whole log. Study-scoped readback is deferred until the storage
        policy can carry a keyed reference. A query parameter this operation does not declare is
        refused with `400` rather than ignored, so a caller cannot believe a filter applied when it
        did not.
      parameters:
        - $ref: '#/components/parameters/ScopeHeader'
        - $ref: '#/components/parameters/RequestIdQueryParam'
        - $ref: '#/components/parameters/FunctionQueryParam'
        - $ref: '#/components/parameters/DispositionQueryParam'
        - $ref: '#/components/parameters/SinceQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: Matching audit records, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordCollection'
        '400':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/MalformedRequest'
        '403':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Forbidden'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'

  /v1/audit/records/{request_id}:
    get:
      tags: [audit]
      operationId: getAuditRecord
      summary: Read back the audit record for a single request ID.
      description: |
        Returns the append-only audit record for one request ID, with the same stored fields and the
        same absence of raw PHI as the collection endpoint. A request ID that produced both
        processing events and a final disposition returns the merged record.

        If no record exists for the supplied request ID, `404` is returned. The audit log is
        append-only and is never rewritten, so a record that exists cannot disappear.
      parameters:
        - $ref: '#/components/parameters/ScopeHeader'
        - $ref: '#/components/parameters/RequestIdPathParam'
      responses:
        '200':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          description: The audit record for the supplied request ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecord'
        '400':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/MalformedRequest'
        '403':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/Forbidden'
        '404':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/AuditRecordNotFound'
        '500':
          headers:
            $ref: '#/components/headers/RequestIdHeader'
          $ref: '#/components/responses/UnexpectedError'

components:

  securitySchemes: {}

  parameters:

    FunctionNamePathParam:
      name: function_name
      in: path
      required: true
      description: >-
        The function to execute. A closed enum: unknown functions are rejected rather than processed.
        Phase 1 implements the privacy pipeline around these functions, not their full clinical
        behaviour.
      schema:
        $ref: '#/components/schemas/FunctionName'

    RequestIdPathParam:
      name: request_id
      in: path
      required: true
      description: The request ID of the execution, as returned in the execution response or block receipt.
      schema:
        $ref: '#/components/schemas/RequestId'

    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Optional caller-supplied request ID, honoured if present and recorded in the audit log and
        echoed in the response. If omitted, the server generates one. This is a **header**, not a
        body field: the request ID identifies the request rather than being part of the extraction
        input, and a header is still available when the body is unparseable. The design does not fix
        this choice; the spec does.
      schema:
        $ref: '#/components/schemas/RequestId'
      example: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34

    RequestIdQueryParam:
      name: request_id
      in: query
      required: false
      description: Filter to a single request ID.
      schema:
        $ref: '#/components/schemas/RequestId'

    FunctionQueryParam:
      name: function
      in: query
      required: false
      description: Filter to one function.
      schema:
        $ref: '#/components/schemas/FunctionName'

    DispositionQueryParam:
      name: disposition
      in: query
      required: false
      description: Filter to one final disposition.
      schema:
        $ref: '#/components/schemas/FinalDisposition'

    SinceQueryParam:
      name: since
      in: query
      required: false
      description: Return only records with a timestamp at or after this instant (RFC 3339).
      schema:
        type: string
        format: date-time

    LimitQueryParam:
      name: limit
      in: query
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

    ScopeHeader:
      name: X-Scope
      in: header
      required: true
      description: >-
        The scopes the caller holds, as a comma- or semicolon-separated list of tokens. Each token
        is either `scope:study:<study_reference>` or `scope:function:<FunctionName>`, with the
        function name in the contract's own spelling. A token in any other form grants nothing, and
        so do an absent header, an empty header and a header of unreadable tokens: a caller that
        named no scope holds none, and a request outside the scope presented is `403`.

        **This header is a synthetic demonstration input that models an authorization boundary. It
        is NOT an authentication mechanism and NOT a defence against an attacker.** This document
        declares no security scheme — `components.securitySchemes` is empty and root `security` is
        the empty list — and the design defers roles and per-user permissions to Phase 6. Anyone
        who can reach this server can present any scope they like and the server will believe it.
        What the header *does* exercise is the property the design cares about: a request outside
        the scope it presented is refused with `403` and never reaches the pipeline.

        Declared on every operation that enforces it, because a client generated from a document
        that omits it sends no scope and receives `403` on every operation. The one operation that
        does not require it is `getPolicyConfiguration`, which reads the deployment's own
        configuration and touches no study, draft or record; that is stated on the operation rather
        than left as an omission.
      schema:
        type: string
      example: 'scope:study:STUDY-SYN-000041,scope:function:Draft'

  headers:
    RequestIdHeader:
      description: >-
        The request ID of this exchange, echoed on **every** response including `400`, `403`, `415`
        and `422`. It is the caller's `X-Request-Id` when one was supplied and a server-generated ID
        when one was not, it is the same value the audit record is filed under, and it is present
        even on a response whose body is unparseable — which is the whole reason it is a header and
        not a body field. Declared here rather than left to each response, so the promise is written
        down once.
      schema:
        type: string

  responses:

    Blocked:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: >-
        Privacy-policy block. The request was well-formed and authorized, but the privacy pipeline
        could not produce a policy-compliant payload, so **nothing was transmitted** to a provider in
        either implemented mode. Raw PHI values never appear in this body.

        This is the `422` counterpart to `403`. A caller distinguishes a privacy block from an
        authorization failure by status code alone: `422` here, `403` there.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BlockReceipt'
          examples:
            unresolvedNerCandidate:
              summary: Design §6 row 4 — layer 2 NER candidate below confidence threshold, or with no deterministic replacer.
              value:
                status: blocked
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                layer: D.2
                action_codes: [NER_UNRESOLVED]
                policy_version: ps315-baseline-v1
            fieldOutsideAllowlist:
              summary: Design §6 row 2 — field outside the function allowlist; rejected by A, no downstream processing.
              value:
                status: blocked
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                layer: A
                action_codes: [FIELD_NOT_ALLOWLISTED, UNKNOWN_FUNCTION]
                policy_version: ps315-baseline-v1
            deterministicReplacementFailed:
              summary: Design §6 row 3 — layer 1 could not deterministically remove or replace a required structured field.
              value:
                status: blocked
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                layer: D.1
                action_codes: [DETERMINISTIC_REPLACEMENT_FAILED]
                policy_version: ps315-baseline-v1
            contractViolation:
              summary: >-
                Design §6 row 5 — layer 3 contract violation (missing/extra field, unshifted date, missing
                surrogate, leftover pattern match, or hash mismatch).
              value:
                status: blocked
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                layer: D.3
                action_codes: [UNSHIFTED_DATE, LEFTOVER_PATTERN_MATCH]
                policy_version: ps315-baseline-v1
            policyEngineFailClosed:
              summary: >-
                Design §6 row 6 — unresolved disposition, unknown or missing policy version, or policy
                configuration error. Blocks in every implemented mode.
              value:
                status: blocked
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                layer: E
                action_codes: [UNRESOLVED_DISPOSITION, UNKNOWN_POLICY_VERSION, POLICY_CONFIG_ERROR]
                policy_version: ps315-baseline-v1
            gatewayRejection:
              summary: >-
                Design §6 row 7 — payload was not the exact object E approved, or the model identifier is
                unknown. No provider call is made.
              value:
                status: blocked
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                layer: F
                action_codes: [PAYLOAD_MISMATCH, UNKNOWN_MODEL]
                policy_version: ps315-baseline-v1

    MalformedRequest:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: >-
        The request could not be understood as a request at all: unparseable body, wrong media type,
        or a JSON document that does not match the request schema. This is a request-construction
        failure (design §6 row 1) and is distinct from both `403` (authorization) and `422`
        (privacy block). Nothing entered the pipeline.

        Where the request is well-formed JSON but violates the schema, the body is a `ValidationError`
        listing the offending fields. Where the body is unparseable, it is a `ProblemDetail`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            schemaViolation:
              summary: Well-formed JSON that does not match the execution request schema.
              value:
                type: https://medarx.invalid/problems/request-validation
                title: Request does not match the execution request schema
                status: 400
                detail: >-
                  Unrecognized or disallowed properties present: dicom_object, prompt. Medarx does not
                  accept arbitrary DICOM objects or free-form prompts at this surface.
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
                errors:
                  - field: body.dicom_object
                    message: Additional properties are not permitted.
                  - field: body.prompt
                    message: Additional properties are not permitted.
            unparseableBody:
              summary: The body could not be parsed as JSON.
              value:
                type: https://medarx.invalid/problems/malformed-request
                title: Malformed request
                status: 400
                detail: Request body is not valid JSON.
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34

    Forbidden:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: >-
        Authorization failure: the caller is not permitted to execute this function, or the study
        context is outside the caller's authorized scope (design §6 row 1).

        This is `403` and never `422`. It is deliberately distinct from a privacy-policy block: the
        request here was not permitted in the first place, whereas a `422` means the request was
        permitted and well-formed but the privacy pipeline refused it. A caller must be able to tell
        these apart by status code alone, without parsing the body.

        Phase 1 exercises a **synthetic** scope; the design's per-user authorization model (roles,
        per-user permissions) is deferred to Phase 6. No authentication scheme is defined for this
        API.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            functionNotPermitted:
              summary: The function is not permitted for this caller.
              value:
                type: https://medarx.invalid/problems/function-not-permitted
                title: Function not permitted
                status: 403
                detail: The requested function is not permitted in the caller's scope.
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34
            studyScopeUnauthorized:
              summary: The study context is outside the caller's authorized scope.
              value:
                type: https://medarx.invalid/problems/study-scope-unauthorized
                title: Study scope not authorized
                status: 403
                detail: The requested study is not within the caller's authorized scope.
                request_id: 7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34

    UnsupportedMediaType:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: >-
        The request media type is not `application/json`. This API accepts structured JSON only; it
        does not accept DICOM multipart payloads, so `multipart/related` and `application/dicom` are
        rejected here by design.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    FunctionNotFound:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: >-
        The `function_name` path segment does not name one of the three closed functions
        (`Draft`, `Prior Summary`, `Ask`). The function set is closed, not free-form, so an
        unrecognized name is not processed; a request naming an unknown function never enters the
        pipeline. This path-shaped case is reported as `404` because no such function resource
        exists; the same condition arriving as a body field against a valid path is reported as a
        `422` block with `layer: A` and `action_codes` containing `UNKNOWN_FUNCTION`, since the design
        assigns unknown-function rejection to component A.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ExecutionNotFound:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: No execution exists for the supplied request ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    AuditRecordNotFound:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: No audit record exists for the supplied request ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    UnexpectedError:
      headers:
        $ref: '#/components/headers/RequestIdHeader'
      description: >-
        An unexpected server-side failure. Sensitive-data filtering is applied to application logs,
        exception traces, and tracing spans under the same policy as the audit log, so no raw PHI is
        disclosed through this response or its logs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:

    FunctionName:
      type: string
      title: FunctionName
      description: >-
        The closed set of Medarx functions. The set is closed by design: functions are a fixed,
        enumerated surface, not free-form.

        Phase 1 implements the **privacy pipeline around** these functions, not their full clinical
        behaviour. Phase 1 exercises the pipeline with report text and metadata; `Draft`'s automated
        output validation is a Phase 4 concern, and `Prior Summary` / `Ask` contract validation is a
        Phase 5 concern. What Phase 1 proves for each is authorization, allowlisted extraction,
        pseudonymization, layered redaction, and policy approval or refusal before transmission.
      enum:
        - Draft
        - Prior Summary
        - Ask

    RequestId:
      type: string
      description: >-
        Identifier of a single API request. Generated by the server when the caller does not supply
        one; carried on every block receipt, every successful execution response, and every audit
        record.
      examples: [7f3c1a90-2b6e-4f1a-9d55-2c8b7e0a1f34]

    PolicyVersion:
      type: string
      description: >-
        The de-identification policy version in force. Appears in block receipts, execution
        responses, and audit records. An unknown or missing policy version causes a fail-closed block
        in every implemented mode.

        This is a free string and every value in this document is illustrative: `ps315-baseline-v1`
        and the values in the `Blocked` examples name the *shape* of a receipt, not what a given
        deployment publishes. A deployment publishes the version it is configured with, so a receipt
        read against a running system carries that deployment's own string.
      examples: [ps315-baseline-v1]

    PolicyMode:
      type: string
      description: >-
        The configured policy mode (component E). Fixed per deployment; never selectable per request.
      enum:
        - strict_local
        - cloud
        - authorized_local

    Layer:
      type: string
      description: >-
        The flagging component on a block receipt, corresponding to the design's §6 enforcement table.
        `J` is the application API itself (input-shape rejection at the surface); `A` is the
        structured payload extractor; `C` is the pseudonymization service; `D.1`, `D.2`, and
        `D.3` are layered redaction layers 1–3; `E` is the policy engine; `F` is the model gateway.
      enum:
        - J
        - A
        - D.1
        - D.2
        - D.3
        - E
        - F
        - C

    ActionCode:
      type: string
      description: >-
        A non-raw disposition code from component G's action-code table. Codes classify what was
        done or refused; they never carry a raw value, so a block receipt is safe to log and return
        in full.

        The set is an open enumeration at the schema level because G's table is the authoritative
        source and is expected to grow. The values below are **not** all emitted in Phase 1, and the
        five that are not fall into two groups that are tracked differently.

        Three are advertised by a published example, so the example-reachability sweep can see that
        they are unreachable: `ARBITRARY_DICOM_OBJECT_REJECTED` and `FREE_FORM_PROMPT_REJECTED`,
        which belong to the application API's request surface (component J, not written yet), and
        `UNRESOLVED_DISPOSITION`, which is declared and deliberately unemitted because component E
        blocks an unresolved disposition under the disposition's own code. Each of the three is
        listed as pending in `backend/tests/test_contract_schemas.py::_NOT_YET_EMITTED`, and that
        set is held equal to the pairs the contract's own examples advertise, so it cannot grow to
        cover a real failure.

        Two are not advertised anywhere: `FUNCTION_NOT_PERMITTED` and `UNAUTHORIZED_SCOPE` are
        reserved for component J, and no published example carries them. A code that appears in no
        example is invisible to the example-reachability sweep by construction — there is no
        example for it to be unreachable *in* — so these two are declared in
        `backend/tests/test_contract_schemas.py::_RESERVED_NOT_ADVERTISED` instead and are checked
        in the one direction that is available to them: that the package has not started emitting
        them. The gap is recorded rather than smoothed: until J is written, these two are reserved
        by this description and by G's code table alone, and nothing would catch a component that
        began emitting one without also declaring it.

        A code published for a block the kernel cannot produce would be a claim about behaviour, so
        this description does not make one.
      examples:
        - NER_UNRESOLVED
      enum:
        - NER_UNRESOLVED
        - DETERMINISTIC_REPLACEMENT_FAILED
        - CONTRACT_VIOLATION
        - HASH_MISMATCH
        - LEFTOVER_PATTERN_MATCH
        - UNSHIFTED_DATE
        - MISSING_SURROGATE
        - FIELD_NOT_ALLOWLISTED
        - UNKNOWN_FUNCTION
        - UNRESOLVED_DISPOSITION
        - UNKNOWN_POLICY_VERSION
        - POLICY_CONFIG_ERROR
        - PAYLOAD_MISMATCH
        - UNKNOWN_MODEL
        - ARBITRARY_DICOM_OBJECT_REJECTED
        - FREE_FORM_PROMPT_REJECTED
        - UNAUTHORIZED_SCOPE
        - FUNCTION_NOT_PERMITTED
        - UNKNOWN_DICOM_ATTRIBUTE
        - UNRESOLVED_EMPTY_BODY
        - UNAPPROVED_PAYLOAD
        - MALFORMED_METADATA
        - SURROGATE_SHAPED_REFERENCE_REJECTED
        - LOW_CONFIDENCE_NER_UNRESOLVED

    PipelineStage:
      type: string
      title: PipelineStage
      description: >-
        A stage boundary of the privacy pipeline, in pipeline order, and the stages the UI's
        privacy-details drawer renders: `Fields selected` is component A's allowlisted extraction,
        `Pseudonymized` is component C, `Text screened` is redaction layers 1 and 2, `Payload
        validated` is layer 3, `Policy decision` is component E, and `Model request` is component F.

        The set is closed and the order is part of the contract. **No stage is stored.** A record
        carries the `layer` that refused it, and `stages` on `AuditRecord` is derived from that at
        read time: the prefix of this enumeration up to and including the stage owning the layer, and
        all six when there is no layer because nothing refused the request. A stage says *how far a
        request got*; a layer says *who refused it*; neither is derivable from the other, and the
        readback publishes both.


        The same derivation appears on `PreflightResponse.stages`, applied to a request that reached
        no refusal **and stopped before F**: a preflight reports the five stages whose components it
        ran, and never `Model request`. The two lists come from one component table, so they cannot
        disagree about which stage a component owns.

        **A `layer` of `J` yields an empty list.** The request surface refused before any stage was
        behind the request, so a timeline built from `stages` alone is zero-length. A client must
        render that as "refused at the request surface, before the pipeline ran" and not as a missing
        or broken timeline: a `403` shown on an empty privacy timeline with no explanation reads as a
        bug rather than as the answer.

        A stage name carries no value and no PHI: it says which boundary this is, never what passed
        through it.
      enum:
        - Fields selected
        - Pseudonymized
        - Text screened
        - Payload validated
        - Policy decision
        - Model request

    StudyContext:
      type: object
      additionalProperties: false
      required:
        - study_reference
      description: >-
        Study-scoped context for the request. In Phase 1 all study and prior records are synthetic.
        The study reference is an internal reference; the pseudonymization service exchanges it for a
        stable surrogate before anything is sent to a model provider.
      properties:
        study_reference:
          type: string
          description: >-
            Internal study reference. Replaced by a stable surrogate identifier within an authorized
            scope before the payload reaches the model gateway. It is not a DICOM StudyInstanceUID and
            is never transmitted as-is.
          examples: ['STUDY-SYN-000041']
        patient_reference:
          type: string
          description: >-
            Internal patient reference, if the caller knows it. This is the reference the
            de-identification policy's **per-patient** date shift is chosen by, and supplying it is
            what makes design §3 C's stated invariant — "the date shift preserves sequence and
            duration" — hold *across* two studies of one patient rather than only within one study.

            Optional, and a request that omits it is not refused: the shift still applies, and the
            fallback is the `PatientID` in `dicom_metadata` where the caller supplied one, and the
            study reference otherwise. **The study-reference fallback is a weaker guarantee** — a
            study is not a patient, so two studies of one patient that omit both references are
            shifted by two unrelated offsets, the interval between them is not preserved, and can
            invert. The reference is a pseudonymization key: it is never carried in a payload, never
            reaches a model provider, and is not stored in the audit log, whose storage policy has no
            field for a subject reference and must not gain one.
          examples: ['PAT-SYN-000041']
        accession_reference:
          type: string
          description: >-
            Internal accession reference, if known. Detected by the mandatory custom clinical
            recognizer for accession number; surrogate-substituted on the same path.
          examples: ['ACC-SYN-0000417']
        encounter_reference:
          type: string
          description: Internal encounter reference, if known. Surrogate-substituted on the same path.
          examples: ['ENC-SYN-0000417']
        modality:
          type: string
          description: >-
            Modality of the source study, as reported. Metadata only — Medarx performs no diagnostic
            image interpretation and never derives findings from pixels.
          examples: [CT]

    PriorStudyReference:
      type: object
      additionalProperties: false
      required:
        - prior_study_reference
      description: >-
        A reference to a prior study, as supplied by the caller. Only the reference is carried; prior
        study content is not inlined into the request, and Orthanc/DICOMweb integration is deferred to
        Phase 2. The reference is surrogate-substituted by the pseudonymization service.
      properties:
        prior_study_reference:
          type: string
          examples: ['STUDY-SYN-000012']
        study_date:
          $ref: '#/components/schemas/DicomDate'
          description: >-
            Date of the prior study, in the DICOM `DA` form. Subject to the consistent per-patient
            date shift, which preserves sequence and duration.

    DicomDate:
      type: string
      pattern: '^[0-9]{8}$'
      description: >-
        A DICOM `DA` (date) value: exactly eight digits, `YYYYMMDD`.

        **Not** ISO 8601. `format: date` in this document means `YYYY-MM-DD`, which is a different
        string. Component C accepts only the `DA` form, so a request carrying an ISO date is refused
        there — layer `C`, `UNSHIFTED_DATE` — every time, and nothing reaches the model gateway.
        The `DA` form is used rather than the format so that the document says the thing the
        pipeline actually enforces.

        `pattern` states the shape only. Whether the eight digits name a real calendar day
        (`20260230` does not) is judged by the pipeline, which refuses rather than forwarding a
        date it cannot shift.
      examples:
        - '20260114'

    AllowlistedDicomMetadata:
      type: object
      additionalProperties: false
      required: []
      description: >-
        A **closed, allowlisted** set of DICOM metadata fields carried alongside the report text.

        This is the structural expression of the design's load-bearing constraint that the API never
        accepts arbitrary DICOM objects. An arbitrary DICOM object cannot be expressed here: there is
        no property for a raw object, a byte payload, an element stream, or a file reference, and
        `additionalProperties` is `false` so unknown elements are rejected. A field outside the
        function's allowlist is rejected by component A before any downstream processing.

        **The property names are the DICOM keywords**, and that is deliberate rather than cosmetic:
        component A's known-attribute table *is* the boundary's vocabulary, and it matches DICOM
        keywords. A snake_case spelling here would be a request the boundary refuses with
        `UNKNOWN_DICOM_ATTRIBUTE` and a `422`, so the two are held to the same names and a test
        asserts that every property below is a keyword layer A accepts. There is no translation
        layer between them, because two vocabularies would be two things to keep in step.

        Values are the caller-supplied metadata strings, not DICOM datatypes. Full PS3.15-conformant
        de-identification of DICOM objects is component B's responsibility, and component B is
        explicitly **not** on the model path.
      properties:
        PatientID:
          type: string
          description: >-
            PatientID. Covered by a mandatory custom `PatternRecognizer` — the stock NER stack ships
            no recognizer for it, and a bare digit string misread as a date corrupts the payload
            rather than merely leaving it unredacted. Accepted at the boundary and then dropped: it
            reaches the input hash and no payload field.
          examples: ['4452819']
        AccessionNumber:
          type: string
          description: >-
            Accession number. Also covered by a mandatory custom recognizer; Presidio ships none.
            Accepted and dropped, for the same reason as `PatientID`.
          examples: ['ACC0000417']
        InstitutionName:
          type: string
          description: >-
            Institution name, if supplied. Accepted and dropped, for the same reason as `PatientID`.
            Named here because it is treated as an identifier candidate wherever it appears in prose.
          examples: ['Synthetic Imaging Centre']
        StudyDate:
          $ref: '#/components/schemas/DicomDate'
          description: Study date. Shifted per patient; sequence and duration preserved.
        PatientAge:
          type: string
          pattern: '^[0-9]{3}[DWMY]$'
          description: >-
            PatientAge, a DICOM `AS` (age string): three digits and a unit of days (`D`), weeks
            (`W`), months (`M`) or years (`Y`). Component A bands the age before it reaches the
            payload, so neither the exact age nor a decade-wide band spanning a 30-day-old and a
            9-year-old is ever transmitted.
          examples: ['045Y']
        Modality:
          type: string
          description: >-
            Modality of the source study, as reported. Metadata only — Medarx performs no diagnostic
            image interpretation and never derives findings from pixels.
          examples: [CT]
        PriorReportText:
          type: string
          description: >-
            The report text of a prior study, when the caller supplies one. Named here because it is
            the **only** allowlisted DICOM attribute whose value is prose, and therefore the only
            DICOM metadata field the entity detectors in redaction layer 2 read: every other
            attribute below is a keyword, a date, or an age band, and is handled structurally
            (dropped, shifted, or banded) rather than scanned. Omitting it made the only DICOM
            input source with a detection surface unreachable by any caller, so a request
            following this document could not exercise any of the layer-2 code that applies to
            DICOM. Carried only by the functions whose allowlist names it (`Prior Summary` and
            `Ask`); supplying it to `Draft` is `FIELD_NOT_ALLOWLISTED`.
          examples: ['Prior FINDINGS: 6 mm nodule in the right upper lobe. MRN: 4452819.']
        PriorStudyDate:
          $ref: '#/components/schemas/DicomDate'
          description: >-
            Date of the prior study, when the caller supplies one. Shifted by the same per-patient
            offset as `StudyDate`, so the interval between two studies is preserved. Carried only
            by the functions whose allowlist names it (`Prior Summary` and `Ask`).

    ReportText:
      type: object
      additionalProperties: false
      required:
        - text
      description: >-
        Clinician-supplied report text — the single free-text input on this surface.

        It is a documented pipeline input, **not** a prompt. It is not a free-form instruction to a
        model: it is allowlisted content that the extraction, pseudonymization, and redaction layers
        process before any model call. Free-form prompts are rejected at this surface.

        Text is subject to the full redaction pipeline: a candidate in this field that the detectors
        cannot confidently sanitize is exactly the load-bearing block case (design §4 Beat 2).
      properties:
        text:
          type: string
          minLength: 1
          description: >-
            The report text as the clinician wrote it, before pseudonymization and redaction. It is
            never transmitted to a model provider in this form.
          examples:
            - 'FINDINGS: 7 mm nodule in the right upper lobe. Correlate with prior MRN 4452819.'
        source:
          type: string
          description: Where the text came from, for the audit record's input-source attribution.
          enum:
            - synthetic_corpus
            - clinician_supplied

    ExecutionRequest:
      type: object
      additionalProperties: false
      required:
        - study_context
        - report_text
      description: >-
        An execution request. Every property is one the design places on this surface: a function, a
        study context, report text, an allowlisted set of DICOM metadata fields, and any prior-study
        references.

        The schema closes on `additionalProperties: false` precisely so that an arbitrary DICOM
        object, a raw pixel/element payload, or a free-form prompt field cannot be supplied. Unknown
        properties are a malformed request (`400`), and any attempt to smuggle one in through a
        property like `dicom_object`, `pixel_data`, or `prompt` is rejected at the surface with
        nothing entering the pipeline.

        There is deliberately **no** `policy_mode` property: the policy mode is a deployment
        configuration, not a caller choice.
      properties:
        function:
          $ref: '#/components/schemas/FunctionName'
        study_context:
          $ref: '#/components/schemas/StudyContext'
        report_text:
          $ref: '#/components/schemas/ReportText'
        dicom_metadata:
          $ref: '#/components/schemas/AllowlistedDicomMetadata'
        prior_studies:
          type: array
          description: Prior-study references relevant to this request, if any.
          items:
            $ref: '#/components/schemas/PriorStudyReference'
        model_id:
          type: string
          description: >-
            Optional model identifier for component F, validated against the model registry. An
            unknown identifier causes a fail-closed block attributed to `F` with no provider call
            made. Omit to use the deployment's configured default.
          examples: ['openrouter/default']
        requested_language:
          type: string
          description: Optional output language hint passed through to the gateway. Not a prompt.
          examples: [en]

    ModelResponse:
      type: object
      additionalProperties: false
      required:
        - content
      description: >-
        The model gateway's response, returned **as a draft** by `ExecutionResponse.draft`. There is
        no path by which this becomes clinical content without an explicit human decision recorded
        via `recordHumanApproval`.

        The drafting is expressed by the **nesting**, on `ExecutionResponse.draft`. This schema is
        the gateway's answer and nothing more, so it requires no `draft` of its own: a `required`
        entry naming a property this schema does not declare, under `additionalProperties: false`,
        would make every instance of it unstatable and leave the operation with no valid `200` body
        at all.
      properties:
        model_id:
          type: string
          description: The model that produced the response, as validated by the gateway.
        content:
          type: string
          description: The response text. Generated from the approved, redacted payload only.
        finish_reason:
          type: string
          description: The provider's finish reason, as returned over the OpenAI wire spec.
          examples: [stop]
        usage:
          type: object
          additionalProperties: false
          description: Token accounting, as reported by the provider.
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer

    PreflightResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - policy_version
        - payload
        - approved_payload_hash
        - stages
      description: >-
        A validated payload awaiting an explicit human decision to send it. The **third state**:
        `ExecutionResponse.status` is `const approved` and `BlockReceipt.status` is `const blocked`,
        so before this schema the API had two states and a client showing a "needs review" chip
        would have been asserting a privacy state the system never evaluated.

        `status` is `needs_review` and nothing was transmitted. The three states are produced by:
        `preflightFunctionExecution` → `needs_review`; any operation → `blocked`; and
        `sendApprovedExecution` or `createFunctionExecution` → `approved`.

        **This is not a draft and carries no model response.** There is no model in it: it is an
        authorisation to send, held by the server, and `sendApprovedExecution` is the only thing
        that acts on it.
      properties:
        status:
          type: string
          const: needs_review
          description: >-
            Always `needs_review`. Validated, **not yet transmitted**, awaiting a human's explicit
            decision. The only value this schema admits.
        request_id:
          $ref: '#/components/schemas/RequestId'
        payload:
          $ref: '#/components/schemas/PayloadPreview'
        field_actions:
          type: array
          description: >-
            One entry per field of the transformed payload, plus one per request property the
            caller supplied that no payload field carries. Every entry is derived by comparing the
            payload component A produced with the one the policy approved, so a transformation the
            redaction layers did not perform cannot appear here.

            **No entry carries a value, a count or a score.** The `excluded` entries are the
            caller's own identifiers, and a summary that answered "what did you drop?" by quoting
            it would be a leak in the answer.
          items:
            $ref: '#/components/schemas/FieldAction'
        stages:
          type: array
          minItems: 5
          maxItems: 5
          readOnly: true
          description: >-
            The pipeline stages this preflight reached, derived from the component table and not
            stored. **Five of the six, and the one absent is `Model request`**: that stage is
            component F's and a preflight stops before F. A client rendering a six-stage timeline
            from this would be claiming a provider was called.

            This is the same derivation as `AuditRecord.stages` applied to a request that reached
            no refusal, which is why the two can never disagree.
          items:
            $ref: '#/components/schemas/PipelineStage'
        approved_payload_hash:
          type: string
          description: >-
            Hash of the exact payload object a send would transmit, re-derived from that object's
            own content at redaction layer 3 and re-checked by component F. **This is the value a
            send is bound to**, and the value independent egress verification compares observed
            outbound bytes against.
        function:
          $ref: '#/components/schemas/FunctionName'
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        policy_mode:
          $ref: '#/components/schemas/PolicyMode'
        selected_model:
          type: string
          description: >-
            The model the send will use, resolved through the model registry during the preflight.
            An unknown identifier is a `422` under layer `F` here, with no provider call made, so a
            caller learns the model is not registered before it has shown anyone a payload.
        input_hash:
          type: string
          description: >-
            Hash of the caller's input as received, for audit correlation. **This is not
            `payload.input_hash`**, which is component A's own hash of what it extracted and which
            is inside the payload because it is a member of the object being previewed. Two
            different values over two different things; collapsing them would make the preview
            describe something the kernel never hashed.

    PayloadPreview:
      type: object
      additionalProperties: false
      required:
        - function
        - report_text
        - dicom_fields
        - study_ref
        - policy_version
      description: >-
        The transformed payload — the object a send would put on the wire, and **nothing more**.

        Every member of the payload is here, including both hashes, because omitting one would make
        this a *description* of the payload rather than the payload, and the description is the
        thing a client would then be tempted to reconstruct. The OpenAI-wire body the model
        actually receives is built from these values by component F; nothing here is a rendering of
        it, and a client must not build one.

        Every value here has been through allowlisted extraction, pseudonymization, redaction and
        the policy decision, which is what makes returning it safe: it is the content the model was
        going to see, shown before it was sent. It is nevertheless the payload itself, so a client
        must not persist it — the same rule that applies to the request that produced it.
      properties:
        function:
          type: string
          description: The function the payload was built for, in the kernel's own vocabulary.
        report_text:
          type: string
          description: >-
            The report text **as transformed**: pseudonymized and redacted. It is never the text the
            caller supplied, and a client must not show the two side by side as though the
            transformation were a comparison it performed.
        dicom_fields:
          type: object
          additionalProperties:
            type: string
          description: >-
            The allowlisted DICOM fields the payload carries, in component A's canonical snake_case
            field names (`modality`, `study_date`, `patient_age_band`, `prior_report_text`,
            `prior_study_date`). The keyword vocabulary (`Modality`, `StudyDate`, …) is the
            *request* vocabulary; component A's attribute table is the boundary's own, and the two
            are related in exactly one place.

            The identifier attributes a caller supplied are **absent, not blanked**: `PatientID`,
            `AccessionNumber` and `InstitutionName` are accepted by `AllowlistedDicomMetadata`,
            reach the input hash, and carry no payload field at all.
        study_ref:
          type: string
          description: >-
            The study reference as a **surrogate**, exchanged by component C. Never the caller's
            reference as written.
        prior_study_refs:
          type: array
          description: >-
            Prior-study references as surrogates. Empty for functions whose allowlist carries no
            prior fields.
          items:
            type: string
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        input_hash:
          type: string
          description: >-
            Component A's hash of what it extracted, carried on the payload as provenance. **Not**
            the hash of the caller's raw input, which is `PreflightResponse.input_hash`.
        payload_hash:
          type: string
          description: >-
            The hash redaction layer 3 wrote over the pre-redaction one, and the value component F
            re-derives before it will authorise a transmission. This is the payload's identity.

    FieldAction:
      type: object
      additionalProperties: false
      required:
        - field
        - state
      description: >-
        One field of the caller's request, and what happened to it. A classifier, in the same sense
        an action code is a classifier: it says what was done and never carries what was done to.
      properties:
        field:
          type: string
          description: >-
            Either a member of the transformed payload — `report_text`, `study_ref`, `function`,
            `prior_study_refs`, `policy_version`, `input_hash`, `payload_hash`,
            `dicom_fields.<name>` — or a request property the pipeline read and did not carry:
            `dicom_metadata.<DICOMKeyword>`, `study_context.patient_reference`,
            `study_context.accession_reference`, `study_context.encounter_reference`,
            `study_context.modality`, `report_text.source`.

            One namespace, because a summary that enumerated only the payload would leave a caller
            unable to see that a value they supplied was dropped — which is the answer they most
            need. A dotted name is a path into the payload, or into the request body as the caller
            wrote it.
        state:
          type: string
          enum:
            - included
            - transformed
            - excluded
          description: >-
            * `included` — carried into the payload unchanged from what component A produced.
            * `transformed` — present in the payload but different from what component A produced,
              by component C's surrogate substitution, a redaction layer, or layer 3's re-hash.
            * `excluded` — the caller supplied it and no payload field carries it. **The value is
              not returned.**

            The set is closed. There is no fourth state, and in particular no "partially redacted":
            a field is either a payload member or it is not, and the only question the pipeline can
            answer about one that is has been transformed or not.

    ExecutionResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - draft
        - policy_version
      description: >-
        The approved-path response: the model response plus the request ID, the identity of the
        approved payload that was transmitted, and the policy version under which it was approved.

        The payload is identified by hash. The hash is what egress verification checks observed
        outbound bytes against, using two observers that are both external to the Medarx process —
        Medarx's own audit log is explicitly not accepted as evidence of what left.

        **This response carries no `stages` and no `layer`.** It is a closed schema the design
        fixes, and the pipeline timeline is the audit log's to answer: a client that wants to draw
        one reads `getAuditRecord`, where `stages` is derived from the stored `layer` on read. That
        is the architecturally correct source — the audit log is the evidence, and a timeline built
        from the live execution would be Medarx attesting to itself. A caller on the validate-then-
        send path does not need it: `PreflightResponse` carries the stages for the preflight, and
        this operation is the atomic one.
      properties:
        status:
          type: string
          const: approved
          description: The pipeline approved the payload and the gateway returned a response.
        request_id:
          $ref: '#/components/schemas/RequestId'
        function:
          $ref: '#/components/schemas/FunctionName'
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        policy_mode:
          $ref: '#/components/schemas/PolicyMode'
        selected_model:
          type: string
          description: The model the gateway used.
        approved_payload_hash:
          type: string
          description: >-
            Hash of the exact approved payload object transmitted. Computed at redaction layer 3 and
            verified against observed egress bytes by component I.
          examples: ['sha256:02f1a0c9d4b7e6a3f5c8d1e0b2a4f6c8d0e2b4a6c8e0f2d4b6a8c0e2f4d6b8a0']
        input_hash:
          type: string
          description: Hash of the caller's input as received, for audit correlation.
        draft:
          allOf:
            - $ref: '#/components/schemas/ModelResponse'
          description: >-
            The model response, presented as a draft requiring explicit human sign-off. It has **not**
            been approved and has not been written to any clinical system.

    BlockReceipt:
      type: object
      additionalProperties: false
      required:
        - status
        - request_id
        - layer
        - action_codes
        - policy_version
      description: >-
        The structured block receipt returned on any refusal to transmit (HTTP `422`).

        **Raw PHI values never appear in a block receipt.** `layer` names the flagging component and
        `action_codes` are the non-raw disposition codes; both classify the refusal without quoting
        the content that caused it, so a receipt is safe to return in full and to log.

        The receipt is returned in every block condition, and the two independent egress observers
        record zero outbound bytes for a blocked request.

        **This receipt carries no `stages` and no `layer`-derived timeline, by design.** It has
        exactly five fields because five is what an auditor is given, and a message field would
        change that artefact rather than describe it. A client that wants to know how far the
        request got reads `getAuditRecord` for the same request ID, where `stages` is derived from
        the stored `layer` — including the zero-length case, which is what a `layer` of `J` yields.
      properties:
        status:
          type: string
          const: blocked
          description: Always `blocked`. The only value this schema admits.
        request_id:
          $ref: '#/components/schemas/RequestId'
        layer:
          allOf:
            - $ref: '#/components/schemas/Layer'
          description: "The flagging component: J, A, C, D.1, D.2, D.3, E, or F."
        action_codes:
          type: array
          minItems: 1
          description: >-
            One or more non-raw disposition codes from component G's action-code table. These
            classify what the pipeline refused to do; they never carry a value.

            They are **every unresolved disposition's code, not only the naming layer's**. `layer`
            names the first component that flagged anything and the layers after it keep flagging:
            an entity layer 2 cannot resolve is left in the payload, and layer 3's deterministic
            re-read then finds the same span still matching. A receipt reading
            `layer: D.2, action_codes: [NER_UNRESOLVED, LEFTOVER_PATTERN_MATCH]` is one refusal
            reported by two layers, not a mis-filed code — and a code whose declared owners do not
            include the naming layer is a defect in component G's table, not in the receipt.
          items:
            $ref: '#/components/schemas/ActionCode'
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'

    ValidationError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      description: A single request-shape violation.
      properties:
        field:
          type: string
          description: Dotted path to the offending property, e.g. `body.dicom_metadata.patient_name`.
        message:
          type: string
          description: What is wrong with it, in terms the caller can act on.

    ProblemDetail:
      type: object
      description: >-
        RFC 9457 problem document, used for `400`, `403`, `404`, `409`, and `415` responses. Used in
        preference to the `BlockReceipt` wherever the request was never a valid request; a privacy
        block always uses the `BlockReceipt` instead.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: Stable problem-type URI.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          description: The HTTP status code, repeated for clients that do not read the status line.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        request_id:
          $ref: '#/components/schemas/RequestId'
        errors:
          type: array
          description: Per-field detail, present on schema violations.
          items:
            $ref: '#/components/schemas/ValidationError'

    HumanApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - decision
        - reviewer
      description: >-
        A human sign-off decision. The draft is identified by request ID and is neither modified nor
        resubmitted through this path; editing a draft requires a new execution, which re-runs the
        full privacy pipeline.
      properties:
        decision:
          type: string
          description: The human's decision. Only an explicit human decision counts; there is no default.
          enum:
            - approved
            - rejected
        reviewer:
          type: string
          minLength: 1
          description: >-
            Identity of the human reviewer. Synthetic in Phase 1, since the design's per-user
            authorization model is deferred to Phase 6.
          examples: [synthetic-reviewer-01]
        note:
          type: string
          description: >-
            Optional free-text rationale recorded in the audit log. Recorded as a reviewer note and
            subject to the same sensitive-data filtering as every other log surface; it is not
            transmitted to any model provider.

    HumanApprovalResponse:
      type: object
      additionalProperties: false
      required:
        - request_id
        - decision
        - recorded_at
      description: >-
        Confirmation that a human decision was appended to the audit log. This is a record of a
        human judgement, not a transmission of anything: no clinical system is written to.
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        decision:
          type: string
          enum:
            - approved
            - rejected
        recorded_at:
          type: string
          format: date-time
          description: When the decision was appended to the audit log.
        final_disposition:
          $ref: '#/components/schemas/FinalDisposition'

    FinalDisposition:
      type: string
      description: >-
        The end state of a request as recorded in the audit log.
      enum:
        - approved
        - blocked
        - pending_human_approval
        - approved_by_human
        - rejected_by_human

    PolicyConfiguration:
      type: object
      additionalProperties: false
      required:
        - policy_mode
        - policy_version
        - implemented_modes
      description: >-
        The policy configuration in force, as read from component E. The mode is a deployment
        configuration and is fixed; no request may select it.
      properties:
        policy_mode:
          $ref: '#/components/schemas/PolicyMode'
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        implemented_modes:
          type: array
          description: >-
            The modes implemented in v1: `strict_local` and `cloud`, each the default in its
            deployment. `authorized_local` is a documented architectural extension only and is
            deliberately absent from this list.
          items:
            type: string
            enum:
              - strict_local
              - cloud
        fail_closed:
          type: boolean
          const: true
          description: >-
            Always `true`. Every failure mode trends to block, never to send, in every implemented
            mode.
        extensions:
          type: array
          description: >-
            Documented modes that are **not** implemented. Present so a reader is not left guessing
            whether `authorized_local` is available.
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - implemented
              - note
            properties:
              name:
                type: string
                enum:
                  - authorized_local
              implemented:
                type: boolean
                const: false
              note:
                type: string
                description: >-
                  Documented as an architectural extension only. It is never implemented against
                  identifiable data in the demo, and its definition of a "trusted environment" is
                  deferred beyond Phase 6.

    AuditRecord:
      type: object
      additionalProperties: false
      required:
        - request_id
        - timestamp
        - function
        - policy_version
        - final_disposition
      description: >-
        One record from the append-only, tamper-evident audit log.

        The properties below are **exactly** the fields the storage policy persists: request ID and
        timestamp, function and selected model, de-identification policy version, input and
        approved-payload hashes, redacted field names and action codes, human approval, and final
        disposition.

        There is no raw-PHI property on this schema, and that absence is the design, not an omission
        in the documentation: raw PHI is never stored in the normal audit log, so there is no such
        field to return. Full model prompt and response live only in a separate optional restricted,
        encrypted diagnostic store, which this API does not expose.
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        timestamp:
          type: string
          format: date-time
          description: When the event was appended.
        function:
          $ref: '#/components/schemas/FunctionName'
        selected_model:
          type: string
          description: The model used, if the request reached the gateway. Absent for a blocked request.
        policy_version:
          $ref: '#/components/schemas/PolicyVersion'
        policy_mode:
          $ref: '#/components/schemas/PolicyMode'
        input_hash:
          type: string
          description: Hash of the caller's input as received.
        approved_payload_hash:
          type: string
          description: >-
            Hash of the exact approved payload transmitted. Absent for a blocked request, since
            nothing was approved.
        redacted_field_names:
          type: array
          description: >-
            Names of the fields the redaction layers acted on. Field **names** only — never the
            values they held. This is a deliberate record of what was processed without becoming a
            second store of what was in it.
          items:
            type: string
          examples:
            - [report_text, dicom_metadata.patient_id, dicom_metadata.accession_number]
        action_codes:
          type: array
          description: Non-raw disposition codes recorded for this request.
          items:
            $ref: '#/components/schemas/ActionCode'
        human_approval:
          oneOf:
            - $ref: '#/components/schemas/HumanApprovalState'
            - type: 'null'
          description: >-
            The recorded human sign-off, or `null` while the draft is still awaiting review. A
            `null` here means "not yet decided", never "decided not to review".
        final_disposition:
          $ref: '#/components/schemas/FinalDisposition'
        chain_verified:
          type: boolean
          description: >-
            Result of hash-chain verification over the records returned by this query. A relational
            database alone does not make a log immutable, so tamper evidence is verified on read
            rather than asserted.
          examples: [true]
        layer:
          oneOf:
            - $ref: '#/components/schemas/Layer'
            - type: 'null'
          description: >-
            The component that refused the request, or `null` when nothing refused it, which is the
            approved case. A classifier with no value in it, and the only field on this schema from
            which `stages` is derived.
        stages:
          type: array
          readOnly: true
          description: >-
            The pipeline stages this request reached, derived at read time from `layer` and not
            stored: the prefix of `PipelineStage` up to and including the stage owning that layer,
            and all six when there is no layer. A request blocked at `D.2` reached three stages and
            never reached `Policy decision` or `Model request`; deriving it is what keeps the two
            from being able to disagree.
          items:
            $ref: '#/components/schemas/PipelineStage'

    HumanApprovalState:
      type: object
      additionalProperties: false
      required:
        - decision
        - recorded_at
      description: A recorded human sign-off decision.
      properties:
        decision:
          type: string
          enum:
            - approved
            - rejected
        recorded_at:
          type: string
          format: date-time
        reviewer:
          type: string
          description: Identity of the reviewing human. Synthetic in Phase 1.

    AuditRecordCollection:
      type: object
      additionalProperties: false
      required:
        - records
        - count
      description: A page of audit records, oldest first.
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/AuditRecord'
        count:
          type: integer
          description: Number of records in this response.
        chain_verified:
          type: boolean
          description: >-
            Aggregate result of hash-chain verification across the returned records. `false` means
            at least one record in the chain did not verify and the log's integrity is in question.
        input_source:
          type: string
          description: >-
            Attributed input source for the matched records, where the caller recorded one.

            **Always absent in Phase 1.** `AuditRecord` is closed and has no input-source field, and
            the audit log's storage policy admits none, so there is no stored value for this member
            to report; populating it needs a new field on a record whose policy says no field may
            hold free text. It is left declared because it is a documented part of this collection,
            and deleting it would be a change with nothing behind it.
          enum:
            - synthetic_corpus
            - clinician_supplied
